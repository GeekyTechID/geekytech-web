name: Deploy to Production VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (forced-command on server)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "184.168.121.243 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOpyR9Zr+tfbovHPfiyBVn9vndgVRgywcHhDs/5JQK00" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key geeky@184.168.121.243 "deploy"
